name: Build & Publish ESP32 Firmware

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  release-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 Board Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Libraries
        run: |
          arduino-cli lib install "NimBLE-Arduino"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"
          mkdir -p ~/Arduino/libraries
          git clone https://github.com/T-vK/ESP32-BLE-Keyboard.git ~/Arduino/libraries/ESP32-BLE-Keyboard

      - name: Compile ESP32 Sketch (.bin)
        run: |
          INO_PATH=$(find . -maxdepth 2 -name "*.ino" | head -n 1)
          echo "Compiling sketch found at: $INO_PATH"
          mkdir -p ./build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --output-dir ./build \
            --export-binaries \
            --verbose \
            "$INO_PATH"

      - name: Compute SHA-256 & Release Assets
        run: |
          cd ./build
          ls -la
          sha256sum *.bin > checksums.txt || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./build/*.bin
            ./build/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
