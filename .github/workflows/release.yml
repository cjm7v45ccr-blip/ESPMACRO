name: Build & Publish ESP32 Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 Board Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Libraries
        run: |
          arduino-cli lib install "NimBLE-Arduino"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"
          
          # Manually install ESP32-BLE-Keyboard
          mkdir -p ~/Arduino/libraries
          git clone https://github.com/T-vK/ESP32-BLE-Keyboard.git ~/Arduino/libraries/ESP32-BLE-Keyboard

      - name: Compile ESP32 Sketch (.bin)
        run: |
          SKETCH_PATH=$(find . -maxdepth 2 -name "*.ino" | head -n 1)
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --build-property "compiler.cpp.extra_flags=-DUSE_NIMBLE" \
            --output-dir ./build \
            "$SKETCH_PATH"

      - name: Compute SHA-256 & Release Assets
        run: |
          cd ./build
          sha256sum *.bin > checksums.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./build/*.bin
            ./build/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}